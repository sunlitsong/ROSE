alg_name: "GRACE"
model_name: "llava"
device: 0

inner_params:
- language_model.model.layers[18].mlp.down_proj.weight

edit_lr: 1.0
n_iter: 400
eps: 1.0
dist_fn: euc # euc, mmd, cos
val_init: cold # cold, warm
val_train: sgd # sgd, pert
val_reg: None # early
reg: early_stop # early_stop
replacement: replace_last # replace_last, replace_all, replace_prompt
eps_expand: coverage # , moving_avg, decay
num_pert: 8 # only matters when using perturbation training
dropout: 0.0

coco_image: VLKEB/VLKEB_images/mmkb_images
rephrase_image: VLKEB/VLKEB_images/mmkb_images
tokenizer_class: AutoTokenizer
tokenizer_name: ./hugging_cache/llava-1.5-7b-hf
model_class: LLaVA
name: hugging_cache/llava-1.5-7b-hf
test_gap: 1